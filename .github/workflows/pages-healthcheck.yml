name: Verificar páginas públicas do escritório
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-healthcheck.yml"
      - "index.html"
      - "CNAME"
      - "site-config.json"
      - "paginas/**"
  schedule:
    - cron: "20 11 * * *"
permissions:
  contents: read
jobs:
  verify-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Testar endpoints HTTPS das páginas existentes
        shell: bash
        run: |
          set -euo pipefail
          sites=(
            "https://andreluizdealmeida.github.io/financiamentocaixa/"
            "https://andreluizdealmeida.github.io/obra-paralizada-caixa/"
            "https://andreluizdealmeida.github.io/refinanciamento/"
            "https://andreluizdealmeida.github.io/servidores-do-GDF/"
            "https://andreluizdealmeida.github.io/Site-/"
            "https://andreluizdealmeida.github.io/site-andre-almeida/"
            "https://andreluizdealmeida.com.br/"
            "https://andreluizdealmeida.com.br/paginas/"
          )
          errors=0
          echo "## Saúde das páginas públicas" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | HTTP | Conteúdo HTML | Destino final |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for url in "${sites[@]}"; do
            body="$(mktemp)"
            http="$(curl --location --silent --show-error --connect-timeout 8 --max-time 25 --retry 2 --retry-delay 4 -o "$body" -w '%{http_code}' "$url" || true)"
            valid="não"
            if grep -iqE '<!doctype html|<html[ >]' "$body"; then valid="sim"; fi
            if [ "$http" != "200" ] || [ "$valid" != "sim" ]; then
              echo "::error::Página inacessível ou não HTML: $url HTTP=$http"
              errors=$((errors+1))
            fi
            echo "| $url | ${http:-000} | $valid | [Abrir]($url) |" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$body"
          done
          echo "Total de falhas: $errors" >> "$GITHUB_STEP_SUMMARY"
          echo "## Links dinâmicos do catálogo" >> "$GITHUB_STEP_SUMMARY"
          manifest_url="https://andreluizdealmeida.com.br/paginas/site-pages.json"
          json="$(curl --location --silent --show-error --connect-timeout 8 --max-time 25 "$manifest_url" || true)"
          if ! echo "$json" | jq -e 'type=="array"' >/dev/null; then
            echo "::error::Manifesto de páginas indisponível ou inválido"
            errors=$((errors+1))
          else
            while IFS= read -r slug; do
              [[ "$slug" =~ ^[a-z0-9][a-z0-9-]{0,59}$ ]] || continue
              page_url="https://andreluizdealmeida.com.br/paginas/$slug/"
              code="$(curl --location --silent --show-error --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code}' "$page_url" || true)"
              echo "| $page_url | $code | Página do catálogo |" >> "$GITHUB_STEP_SUMMARY"
              if [ "$code" != "200" ]; then echo "::error::Página de catálogo quebrada: $page_url"; errors=$((errors+1)); fi
            done < <(echo "$json" | jq -r '.[] | .slug // empty')
          fi
          test "$errors" -eq 0
