name: Diagnosticar Central Unificada Marketing e Paginas Andre OS
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-andre-os-pages-route.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir rotas existentes sem acessar dados privados
        shell: bash
        run: |
          set -euo pipefail
          echo "## Central unificada — acesso HTTP sem login" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rota | HTTP | HTML |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for path in marketing paginas; do
            url="https://andre-legal-os.lovable.app/$path"
            file="$(mktemp)"
            status="$(curl --silent --show-error --location --connect-timeout 8 --max-time 35 -o "$file" -w '%{http_code}' "$url" || true)"
            html="nao"
            if grep -iqE '<!doctype html|<html[ >]' "$file"; then html="sim"; fi
            echo "| /$path | $status | $html |" >> "$GITHUB_STEP_SUMMARY"
            echo "/$path: HTTP $status; HTML $html"
            rm -f "$file"
            if [[ "$status" != "200" || "$html" != "sim" ]]; then
              echo "::error::Rota /$path ainda nao respondeu como HTML"
              exit 1
            fi
          done
          echo "As rotas respondem; esta checagem nao autentica nem testa o editor." >> "$GITHUB_STEP_SUMMARY"
